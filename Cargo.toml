[workspace]
members = [
    "crates/kaya-core",
    "crates/kaya-io",
    "crates/kaya-wal",
    "crates/kaya-lsm",
    "crates/kaya-engine",
    "crates/kaya-sim",
    "crates/kaya-server",
    "crates/kayactl",
    "crates/kaya-raft",
    "crates/kaya-net",
    "crates/kaya-bench",
]
resolver = "2"

[workspace.package]
description = "Correctness-first, inspectable, embeddable storage engine with deterministic fault injection, LSM-tree storage, and Raft consensus"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Tuntii/KayaDB"
rust-version = "1.85"
keywords = ["storage-engine", "lsm-tree", "raft", "database", "correctness"]
categories = ["database-implementations", "data-structures"]

[workspace.dependencies]
kaya-core = { path = "crates/kaya-core" }
kaya-io = { path = "crates/kaya-io" }
kaya-wal = { path = "crates/kaya-wal" }
kaya-lsm = { path = "crates/kaya-lsm" }
kaya-engine = { path = "crates/kaya-engine" }
kaya-raft = { path = "crates/kaya-raft" }
kaya-sim = { path = "crates/kaya-sim" }
kaya-net = { path = "crates/kaya-net" }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
