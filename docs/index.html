<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>KayaDB • Documentation</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <meta name="description" content="Correctness-first distributed key-value database. Install, run, operate clusters, and inspect every on-disk format.">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/themes/vue.css">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/prismjs@1/themes/prism-tomorrow.css">
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'KayaDB',
      repo: 'https://github.com/Tuntii/KayaDB',
      logo: 'kaya-logo.png',
      homepage: 'README.md',

      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,

      notFoundPage: '404.md',

      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Search documentation...',
        noData: 'No results found.',
      },

      formatUpdated: '{MM}/{DD} {HH}:{mm}',
      plugins: [
        function (hook) {
          hook.beforeEach(function (html) {
            const raw = window.location.hash.slice(1).split('?')[0];
            const path = raw.replace(/^\//, '');
            const rootFiles = ['ROADMAP.md', 'CHANGELOG.md', 'CONTRIBUTING.md', 'BENCHMARKS.md', 'CODE_OF_CONDUCT.md'];
            const isRoot = rootFiles.some(function (f) { return path === f || path.endsWith('/' + f); });
            const editBase = isRoot
              ? 'https://github.com/Tuntii/KayaDB/edit/main/'
              : 'https://github.com/Tuntii/KayaDB/edit/main/docs/';
            const editPath = isRoot ? path.split('/').pop() : (path || 'README.md');
            const footer = '<hr><small>Edit on ' +
              '<a href="' + editBase + editPath + '" target="_blank" rel="noopener">GitHub</a> · ' +
              '<a href="https://github.com/Tuntii/KayaDB/issues/new" target="_blank" rel="noopener">Report issue</a></small>';
            return html + footer;
          });
        }
      ]
    };
  </script>

  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/emoji.min.js"></script>
</body>
</html>
