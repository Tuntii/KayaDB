<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>KayaDB • Documentation</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <meta name="description" content="Correctness-first distributed key-value database. Install, run, operate clusters, and inspect every on-disk format.">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/themes/vue.css">
  <!-- Optional: better code highlighting -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/prismjs@1/themes/prism-tomorrow.css">
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'KayaDB',
      repo: 'https://github.com/Tuntii/KayaDB',
      logo: 'kaya-logo.png',

      // Sidebar
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,

      // Search
      search: {
        maxAge: 86400000, // 1 day
        paths: 'auto',
        placeholder: 'Search documentation...',
        noData: 'No results found.',
      },

      // Plugins / behavior
      formatUpdated: '{MM}/{DD} {HH}:{mm}',
      plugins: [
        function (hook) {
          hook.beforeEach(function (html) {
            const footer = '<hr><small>Edit this page on ' +
              '<a href="https://github.com/Tuntii/KayaDB/edit/main/docs/' +
              window.location.hash.slice(1).split('?')[0] +
              '" target="_blank">GitHub</a></small>';

            return html + footer;
          });
        }
      ]
    };
  </script>

  <!-- Docsify core -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>

  <!-- Search plugin -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>

  <!-- Optional: Copy to clipboard for code blocks -->
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>

  <!-- Emoji support -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/emoji.min.js"></script>
</body>
</html>
