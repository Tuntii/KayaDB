[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kaya-py"
version = "0.1.0"
description = "Pure-standard-library Python client for KayaDB"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT OR Apache-2.0" }
keywords = ["kayadb", "database", "client", "lsm", "raft"]

[project.urls]
Homepage = "https://github.com/Tuntii/KayaDB"
Repository = "https://github.com/Tuntii/KayaDB"

[tool.setuptools]
packages = ["kaya"]
