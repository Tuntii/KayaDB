[package]
name = "kaya-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

# Excluded from the workspace so it can be built with nightly via `cargo fuzz`.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
kaya-lsm = { path = "../crates/kaya-lsm" }
kaya-wal = { path = "../crates/kaya-wal" }
kaya-net = { path = "../crates/kaya-net" }

[[bin]]
name = "fuzz_wal_decoder"
path = "fuzz_targets/fuzz_wal_decoder.rs"
test = false
doc = false

[[bin]]
name = "fuzz_sstable_footer"
path = "fuzz_targets/fuzz_sstable_footer.rs"
test = false
doc = false

[[bin]]
name = "fuzz_manifest_decoder"
path = "fuzz_targets/fuzz_manifest_decoder.rs"
test = false
doc = false

[[bin]]
name = "fuzz_sstable_block"
path = "fuzz_targets/fuzz_sstable_block.rs"
test = false
doc = false

[[bin]]
name = "fuzz_command_frame_decoder"
path = "fuzz_targets/fuzz_command_frame_decoder.rs"
test = false
doc = false
