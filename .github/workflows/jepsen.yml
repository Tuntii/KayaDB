name: Jepsen

# Rust-native kaya-jepsen-test harness (primary deliverable).
# - PR / main: smoke scenario only (sequential verify, kill-node nemesis, <5 min)
# - Nightly / release tags: full scenario registry T1–T7 (WGL) + multi-range bank grand matrix
#
on:
  pull_request:
  push:
    branches: [main]
    tags:
      - "v*"
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      suite:
        description: "Suite to run (smoke = PR gate, full = T1–T7 WGL + bank-mr grand matrix)"
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - full

jobs:
  smoke:
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.suite == 'smoke')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "kaya-jepsen-smoke"

      - name: Unit + controller smoke
        run: |
          cargo test -p kaya-jepsen-test --lib -- --test-threads=1
          cargo test -p kaya-jepsen-test --test cluster_controller_smoke -- --test-threads=1

      - name: Chaos smoke (smoke_scenario registry entry)
        run: cargo test -p kaya-jepsen-test --test scenario_smoke -- --nocapture --test-threads=1

  full-suite:
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.suite == 'full')
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "kaya-jepsen-full"

      - name: Full WGL gate (T1–T7 scenario registry)
        run: cargo test -p kaya-jepsen-test --test full_gate -- --ignored --nocapture --test-threads=1

      - name: Multi-range bank grand matrix (split/merge/kill/partition)
        run: cargo test -p kaya-jepsen-test --test grand_matrix -- --ignored --nocapture --test-threads=1

      - name: Linux partition proof (iptables applied>0)
        run: cargo test -p kaya-jepsen-test --test partition_nemesis -- --ignored --nocapture --test-threads=1

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: jepsen-traces
          path: "**/traces/*.jsonl"
          retention-days: 14