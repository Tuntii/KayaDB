name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "kaya-ci"

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: |
          cargo test --workspace --exclude kaya-jepsen-test -- --test-threads=1
          cargo test -p kaya-raft --features disk-storage -- --test-threads=1
          cargo test -p kaya-jepsen-test --lib -- --test-threads=1
          cargo test -p kaya-jepsen-test --test cluster_controller_smoke -- --test-threads=1

      - name: Smoke benchmark (bounded)
        run: cargo bench -p kaya-bench --bench smoke -- --noplot

      - name: Performance regression gate (release)
        # M13-6: CI regression gate for performance envelope.
        # Runs the smoke workload under release profile and fails on severe regression.
        run: cargo test -p kaya-bench --test perf_gate --release -- --nocapture

  # CHAOS_CI_ENABLED defaults false until repo variable is set in GitHub settings.
  chaos-smoke:
    runs-on: ubuntu-latest
    needs: rust
    if: vars.CHAOS_CI_ENABLED == 'true'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p kaya-jepsen-test --test smoke -- --nocapture

