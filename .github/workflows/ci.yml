name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "kaya-ci"

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: |
          cargo test --workspace --exclude kaya-jepsen-test -- --test-threads=1
          cargo test -p kaya-raft --features disk-storage -- --test-threads=1

      - name: eBPF kernel-probes gate (Linux bpf.o load + ringbuf tests)
        run: bash scripts/linux_verify_ebpf_kernel.sh

      - name: Smoke benchmark (bounded)
        run: cargo bench -p kaya-bench --bench smoke -- --noplot

      - name: Performance regression gate (release)
        # M13-6: CI regression gate for performance envelope.
        # Runs the smoke workload under release profile and fails on severe regression.
        run: cargo test -p kaya-bench --test perf_gate --release -- --nocapture

  publish-dry-run:
    name: crates.io publish dry-run
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect crate changes
        id: changes
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}"...HEAD \
            | grep -qE '^(crates/|Cargo\.(toml|lock))'; then
            echo "crates=true" >> "$GITHUB_OUTPUT"
          else
            echo "crates=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip (no crate changes)
        if: steps.changes.outputs.crates != 'true'
        run: echo "No crate changes; skipping publish dry-run."

      - uses: dtolnay/rust-toolchain@stable
        if: steps.changes.outputs.crates == 'true'

      - uses: Swatinem/rust-cache@v2
        if: steps.changes.outputs.crates == 'true'
        with:
          shared-key: "kaya-publish-dry-run"

      - name: cargo publish dry-run (local registry)
        if: steps.changes.outputs.crates == 'true'
        run: bash scripts/ci_publish_dry_run.sh

  kaya-ts:
    name: TypeScript client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test TypeScript client
        working-directory: clients/kaya-ts
        run: npm test


