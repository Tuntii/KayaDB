name: Release Binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build Release for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            bin_name: kayadb-server
            ctl_name: kayactl
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            bin_name: kayadb-server.exe
            ctl_name: kayactl.exe
          - target: x86_64-apple-darwin
            os: macos-latest
            bin_name: kayadb-server
            ctl_name: kayactl
          - target: aarch64-apple-darwin
            os: macos-latest
            bin_name: kayadb-server
            ctl_name: kayactl

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.target }}-

      - name: Build Binaries
        run: |
          cargo build --release --workspace --target ${{ matrix.target }}

      - name: Packaging (Unix)
        if: matrix.os != 'windows-latest'
        run: |
            mkdir -p release-pkg
            cp target/${{ matrix.target }}/release/kayadb-server release-pkg/${{ matrix.bin_name }}
            cp target/${{ matrix.target }}/release/kayactl release-pkg/${{ matrix.ctl_name }}
            cp README.md release-pkg/
            cp LICENSE* release-pkg/ || true
            cp CHANGELOG.md release-pkg/ || true
            cp CODE_OF_CONDUCT.md release-pkg/ || true
            cp docs/security.md release-pkg/ || true
            strip release-pkg/${{ matrix.bin_name }}
            strip release-pkg/${{ matrix.ctl_name }}
            tar -czf kayadb-${{ github.ref_name }}-${{ matrix.target }}.tar.gz -C release-pkg .

      - name: Packaging (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-pkg
          Copy-Item target/${{ matrix.target }}/release/kayadb-server.exe release-pkg/${{ matrix.bin_name }}
          Copy-Item target/${{ matrix.target }}/release/kayactl.exe release-pkg/${{ matrix.ctl_name }}
          Copy-Item README.md release-pkg/
          Copy-Item LICENSE* release-pkg/ -ErrorAction SilentlyContinue
          Copy-Item CHANGELOG.md release-pkg/ -ErrorAction SilentlyContinue
          Copy-Item CODE_OF_CONDUCT.md release-pkg/ -ErrorAction SilentlyContinue
          if (Test-Path docs/security.md) { Copy-Item docs/security.md release-pkg/ }
          Compress-Archive -Path release-pkg/* -DestinationPath kayadb-${{ github.ref_name }}-${{ matrix.target }}.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: kayadb-${{ matrix.target }}
          path: |
            *.tar.gz
            *.zip

  publish-github-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
          body_path: docs/release-notes/v0.1.46.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
