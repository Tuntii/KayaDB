name: Chaos Nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  chaos-full:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "kaya-chaos-nightly"

      - name: Full WGL gate (T1–T7)
        run: cargo test -p kaya-jepsen-test --test full_gate -- --ignored --nocapture --test-threads=1

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: chaos-traces
          path: "**/traces/*.jsonl"
          retention-days: 14