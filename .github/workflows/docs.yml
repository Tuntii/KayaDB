name: Deploy Documentation (GitHub Pages)

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'ROADMAP.md'
      - 'CHANGELOG.md'
      - 'CONTRIBUTING.md'
      - 'BENCHMARKS.md'
      - 'CODE_OF_CONDUCT.md'
      - 'deploy/**/README.md'
      - 'spec/docs/**'
      - 'spec/issues/expanded-implementation-roadmap.md'
      - 'scripts/prepare_docs_site.sh'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Prepare site artifact
        run: bash scripts/prepare_docs_site.sh /tmp/site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '/tmp/site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Output URL
        run: echo "Deployed to ${{ steps.deployment.outputs.page_url }}"