[package]
name = "kaya-ebpf"
description = "Optional Linux eBPF observability for KayaDB: in-process probe lifecycle, trace capture, and Prometheus aggregates"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"
rust-version.workspace = true
keywords = ["kaya", "ebpf", "observability"]
categories = ["development-tools::debugging"]
# Published so kaya-server/kayactl optional `ebpf` feature can resolve on crates.io.
# Default feature set is userspace-only; `kernel-probes` stays Linux/clang optional.

[dependencies]
kaya-core.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
parking_lot = "0.12"
aya = { version = "0.14", default-features = false, optional = true }

[dev-dependencies]
tempfile = "3"

[features]
default = []
kernel-probes = ["dep:aya"]

[lib]
path = "src/lib.rs"