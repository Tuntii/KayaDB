[package]
name = "kaya-sim"
description = "Deterministic simulation runner, SimDisk fault injection, and linearizability checker for KayaDB"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
kaya-core.workspace = true
kaya-io.workspace = true
kaya-engine.workspace = true
kaya-raft.workspace = true
tokio.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_System_Threading",
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lib]
path = "src/lib.rs"

