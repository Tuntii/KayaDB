[package]
name = "kaya-bench"
description = "Criterion benchmark suite for KayaDB: engine workloads, SSTable encode/decode, and WAL append throughput"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
kaya-core.workspace = true
kaya-io.workspace = true
kaya-wal.workspace = true
kaya-lsm.workspace = true
kaya-engine.workspace = true

[dev-dependencies]
criterion = { version = "0.8", default-features = false }
tokio = { version = "1", features = ["rt"] }

[[bench]]
name = "wal_append"
harness = false

[[bench]]
name = "sstable"
harness = false

[[bench]]
name = "engine_workload"
harness = false

[[bench]]
name = "smoke"
harness = false

