[package]
name = "kayactl"
description = "Command-line interface for KayaDB: put/get/delete/scan, inspect WAL/SSTable/Manifest, stats, and recovery"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
kaya-core.workspace = true
kaya-engine.workspace = true
kaya-io.workspace = true
kaya-lsm.workspace = true
kaya-wal.workspace = true
kaya-net.workspace = true
kaya-ebpf = { workspace = true, optional = true }
serde_json = "1"
tokio.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
kaya-ebpf = { workspace = true, optional = true, features = ["kernel-probes"] }
libc = "0.2"

[features]
default = []
ebpf = ["dep:kaya-ebpf"]
tls = ["kaya-net/tls"]

[dev-dependencies]
tempfile = "3"
kaya-ebpf = { workspace = true }

[[bin]]
name = "kayactl"
path = "src/main.rs"