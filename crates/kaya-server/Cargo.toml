[package]
name = "kaya-server"
description = "TCP server process for KayaDB with Raft consensus, cluster bootstrap, and client routing"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
kaya-core.workspace = true
kaya-engine.workspace = true
kaya-io.workspace = true
kaya-net.workspace = true
kaya-raft = { workspace = true, features = ["disk-storage"] }
kaya-ebpf = { path = "../kaya-ebpf", version = "0.1.110", optional = true }
opentelemetry = { version = "0.28", optional = true }
opentelemetry_sdk = { version = "0.28", features = ["trace", "testing"], optional = true }
opentelemetry-stdout = { version = "0.28", features = ["trace"], optional = true }
parking_lot = "0.12"
serde_json = "1"
tokio.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
kaya-ebpf = { path = "../kaya-ebpf", version = "0.1.110", optional = true, features = ["kernel-probes"] }

[features]
default = []
ebpf = ["dep:kaya-ebpf"]
otel = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-stdout",
]
tls = ["kaya-net/tls"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "kayadb-server"
path = "src/main.rs"

[dev-dependencies]
kaya-client = { path = "../kaya-client" }
kaya-net = { path = "../kaya-net" }
kaya-sim = { path = "../kaya-sim" }
serial_test = "3"