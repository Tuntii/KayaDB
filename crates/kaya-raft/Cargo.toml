[package]
name = "kaya-raft"
description = "Raft consensus: leader election, AppendEntries, commit index, and partition-tolerant state machine for KayaDB"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
disk-storage = ["dep:kaya-io"]

[dependencies]
kaya-core.workspace = true
kaya-io = { workspace = true, optional = true }

[dev-dependencies]
kaya-io = { workspace = true }

[[test]]
name = "raft_persist_crash"
required-features = ["disk-storage"]

[lib]
path = "src/lib.rs"
