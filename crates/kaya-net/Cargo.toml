[package]
name = "kaya-net"
description = "Wire codec, TCP transport layer, and node roster management for KayaDB Raft clusters"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
kaya-core.workspace = true
kaya-raft.workspace = true
tokio.workspace = true
tokio-rustls = { version = "0.26", optional = true }
rustls = { version = "0.23", default-features = false, features = ["std", "ring"], optional = true }
rustls-pemfile = { version = "2", optional = true }

[features]
default = []
tls = ["dep:tokio-rustls", "dep:rustls", "dep:rustls-pemfile"]

[lib]
path = "src/lib.rs"
