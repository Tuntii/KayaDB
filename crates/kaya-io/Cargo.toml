[package]
name = "kaya-io"
description = "Disk abstraction trait with FileDisk (real fsync) and SimDisk (deterministic fault injection) for KayaDB"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
io_uring = ["dep:io-uring"]

[dependencies]
kaya-core.workspace = true
aes-gcm = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
# `sync` only: EncryptedDisk holds an async mutex across await points (Send futures).
tokio = { workspace = true, features = ["sync"] }

[target.'cfg(target_os = "linux")'.dependencies]
io-uring = { version = "0.7.13", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
tempfile = "3"

[lib]
path = "src/lib.rs"
